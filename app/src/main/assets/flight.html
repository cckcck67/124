<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>空中遊覽</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
  #map { position: fixed; inset: 0; }
  /* Google 地圖 / 街景會在容器上直接加 position: relative,蓋掉 fixed 後高度變 0(只看到一片黑或後面的 3D 地圖),
     所以用 !important 固定位置與大小 */
  #sv, #pick { position: fixed !important; left: 0; top: 0; width: 100vw !important; height: 100vh !important; z-index: 1; }
  #sv, #pick { display: none; }
  #menu { position: fixed; z-index: 5; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
          gap: 2vh; background: #111; overflow-y: auto; padding: 2vh 0; box-sizing: border-box; }
  #menu h1 { margin: 0; font-size: 6vmin; }
  #list { display: grid; grid-template-columns: repeat(auto-fill, minmax(38vmin, 1fr)); gap: 2vmin; width: 90vw; }
  .place { display: flex; }
  .place button { flex: 1; font-size: 4vmin; padding: 2.5vmin 0; border: 0; border-radius: 1.5vmin; background: #2f5a88; color: #fff; }
  .place.mine button { background: #3c6e47; }
  .place .del { flex: 0 0 9vmin; margin-left: 1vmin; background: #553; }
  #pickBtn { font-size: 4.5vmin; padding: 2vmin 6vmin; border: 0; border-radius: 1.5vmin; background: #8a5a2f; color: #fff; }
  #msg { font-size: 3.6vmin; color: #fd4; text-align: center; max-width: 85vw; }
  #msg button { font-size: 3.6vmin; margin-top: 1.5vmin; padding: 1vmin 3vmin; }
  #title { position: fixed; left: 0; right: 0; top: 3vh; text-align: center; font-size: 5vmin; z-index: 20;
           text-shadow: 0 0 1vh #000, 0 0 2vh #000; pointer-events: none; transition: opacity 2s; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity 0.6s; z-index: 10; }
  /* 凝視地面前進:畫面下方的箭頭 + 慢慢填滿的圓圈 */
  #gaze { position: fixed; left: 50%; bottom: 14vh; width: 18vmin; height: 18vmin; margin-left: -9vmin; border-radius: 50%;
          display: none; z-index: 8; pointer-events: none; align-items: center; justify-content: center;
          background: conic-gradient(#ffd040 var(--p, 0%), rgba(255,255,255,0.25) 0); }
  #gaze span { width: 14vmin; height: 14vmin; border-radius: 50%; background: rgba(0,0,0,0.65); color: #ffd040;
               display: flex; align-items: center; justify-content: center; font-size: 9vmin; }
  #err { position: fixed; left: 4vw; right: 4vw; bottom: 16vh; z-index: 2147483647; display: none; padding: 2vmin; border-radius: 1.5vmin;
         background: rgba(80,20,20,0.92); color: #fff; font-size: 3.6vmin; text-align: center; pointer-events: none; }
  #pickBar, #ctl { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: none; flex-wrap: wrap; gap: 2vmin; justify-content: center;
                   align-items: center; padding: 2.5vmin; background: rgba(17,17,17,0.85); }
  #pickBar button, #ctl button { font-size: 3.8vmin; padding: 1.8vmin 3.5vmin; border: 0; border-radius: 1.5vmin; background: #2f5a88; color: #fff; }
  #ctl #cResume { background: #8a5a2f; }
  #pickBar input { font-size: 4vmin; padding: 1.5vmin; width: 40vmin; }
  #pickHint { position: fixed; z-index: 5; left: 0; right: 0; top: 0; padding: 2vmin; text-align: center; font-size: 4vmin;
              background: rgba(17,17,17,0.85); display: none; }
  #cross { position: fixed; z-index: 5; left: 50%; top: 50%; width: 12vmin; height: 12vmin; margin: -6vmin 0 0 -6vmin; display: none;
           pointer-events: none; }
  #cross::before, #cross::after { content: ''; position: absolute; background: #f33; box-shadow: 0 0 0.6vmin #000; }
  #cross::before { left: 50%; top: 0; bottom: 0; width: 0.8vmin; margin-left: -0.4vmin; }
  #cross::after { top: 50%; left: 0; right: 0; height: 0.8vmin; margin-top: -0.4vmin; }
</style>
</head>
<body>
<div id="map"></div>
<div id="sv"></div>
<div id="pick"></div>
<div id="cross"></div>
<div id="pickHint">拖動、縮放地圖,讓中間的紅色十字對準想去的地方(點一下也會移過去)</div>
<div id="pickBar">
  <input id="pname" placeholder="地點名稱(存起來用)">
  <button id="pickGo">從這裡起飛</button>
  <button id="pickWalk">散步(街景)</button>
  <button id="pickSave">存成地點</button>
  <button id="pickCancel">取消</button>
</div>
<!-- 2D 畫面的控制列(VR 裡用面板,不顯示) -->
<div id="ctl">
  <button id="cResume">回到航線</button>
  <button id="cPause">暫停</button>
  <button id="cNext">換角度</button>
  <button id="cFwd">前進</button>
  <button id="cAuto">自動散步</button>
  <button id="cTurn">迴轉</button>
  <button id="cHome">回降落點</button>
  <button id="cLand">降落</button>
  <button id="cPick">地圖</button>
  <button id="cMenu">目的地</button>
</div>
<div id="title"></div>
<div id="fade"></div>
<div id="gaze"><span id="gazeArrow">⬆</span></div>
<div id="err"></div>
<div id="menu">
  <h1>空中遊覽</h1>
  <div id="list"></div>
  <button id="pickBtn">在地圖上選地點</button>
  <div id="msg"></div>
</div>
<script>
// 目的地:從遠處朝地標直線慢慢滑行,到附近停住懸停(不繞圈,比較不會暈)
// r = 懸停時離地標的距離、alt = 飛行高度、top = 看向的高度(公尺,海拔)
var PLACES = [
  { name: '台北101',    lat: 25.0340, lng: 121.5645, r: 900,  alt: 650,  top: 300 },
  { name: '京都 清水寺', lat: 34.9949, lng: 135.7850, r: 600,  alt: 420,  top: 120 },
  { name: '日月潭',      lat: 23.8572, lng: 120.9150, r: 2500, alt: 1400, top: 760 },
  { name: '富士山',      lat: 35.3606, lng: 138.7274, r: 9000, alt: 5200, top: 3300 },
  { name: '巴黎 鐵塔',    lat: 48.8584, lng: 2.2945,   r: 800,  alt: 450,  top: 180 },
  { name: '紐約 曼哈頓',  lat: 40.7580, lng: -73.9855, r: 1200, alt: 550,  top: 200 }
];
var GLIDE_SEC = 240;     // 速度 1 倍時,一段滑行約 4 分鐘
var START_FAR = 3;       // 從 3 倍懸停距離的地方出發
var M_PER_DEG = 111320;

var key = '', map = null, place = null;
var leg = 0;             // 第幾個方向接近(每次「換角度」轉 90 度)
var progress = 0;        // 0 = 出發點,1 = 懸停點
var paused = false, last = 0, looping = false;
var speed = 1, altScale = 1;
var vr = false;                   // App 是否在 VR 模式(VR 裡轉頭看,2D 用手勢)
var manual = false;               // 2D 時用手勢移動了地圖:自動飛行先停住,不再蓋掉手勢
var lookYaw = 0, lookPitch = 0;   // 轉頭角度(度):向右、向上為正,由 App 傳入
var landed = false, pano = null, panoBase = 0;   // 降落後的街景與預設面向
var landPano = '';                // 降落時的街景點(回降落點用)
var pendingFace = false;          // 降落後等路的資料出來,再決定要不要轉向
var walkAuto = false, walkSec = 4, lastStep = 0;   // 自動散步:每 walkSec 秒往前走一步
var pickMap = null;

function $(id) { return document.getElementById(id); }
function msg(html) { $('msg').innerHTML = html; }
function menuShown() { return $('menu').style.display !== 'none'; }
function picking() { return $('pick').style.display === 'block'; }

function flash(text) {
  var t = $('title');
  t.textContent = text;
  t.style.opacity = 1;
  clearTimeout(flash.timer);
  flash.timer = setTimeout(function () { t.style.opacity = 0; }, 4000);
}

// 錯誤直接顯示在最上層(不會被淡出的黑幕蓋住),停留 15 秒,方便截圖回報
function showErr(text) {
  var e = $('err');
  e.textContent = text;
  e.style.display = 'block';
  clearTimeout(showErr.timer);
  showErr.timer = setTimeout(function () { e.style.display = 'none'; }, 15000);
  if (menuShown()) msg(text);
}
window.addEventListener('error', function (e) {
  showErr('發生錯誤:' + (e && e.message ? e.message : e));
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e && e.reason;
  showErr('發生錯誤:' + (r && r.message ? r.message : r));
});
// Google 地圖的錯誤代碼(印在 console.error)翻成白話,顯示出來
var MAP_ERRORS = {
  ApiNotActivatedMapError: '這把金鑰的 Google Cloud 專案沒有啟用「Maps JavaScript API」',
  BillingNotEnabledMapError: '這把金鑰的 Google Cloud 專案沒有綁定帳單(付款方式);街景、2D 地圖需要綁定(有每月免費額度)',
  ApiTargetBlockedMapError: '金鑰的「API 限制」沒有勾選「Maps JavaScript API」',
  RefererNotAllowedMapError: '金鑰的「網站限制」不允許 https://appassets.androidplatform.net/*',
  InvalidKeyMapError: '金鑰無效,請重新複製貼上',
  ExpiredKeyMapError: '金鑰已過期,請重新產生',
  MissingKeyMapError: '沒有金鑰',
  OverQuotaMapError: '超過使用額度',
  DeletedApiProjectMapError: '金鑰的專案已被刪除'
};
(function () {
  var orig = console.error;
  console.error = function () {
    try {
      var text = Array.prototype.join.call(arguments, ' ');
      var m = text.match(/([A-Za-z]+MapError)/);
      if (m) showErr('Google 地圖錯誤:' + (MAP_ERRORS[m[1]] || m[1]) + '(' + m[1] + ')');
    } catch (e) {}
    return orig.apply(console, arguments);
  };
})();

// Google 拒絕這把金鑰(沒開對應的服務、或限制了網址)
window.gm_authFailure = function () {
  showErr('Google 拒絕了金鑰:請在 Google Cloud 確認已啟用 Maps JavaScript API,且金鑰的限制允許這個 App');
};

// ---------------- App 介面 ----------------

// App 傳入金鑰(只在 App 內建頁面才會傳)
window.vrSetKey = function (k) {
  key = k || '';
  if (!key) {
    msg('還沒有設定 Google 金鑰<br><button onclick="location.href=\'vrweb://key\'">設定金鑰</button>');
    return;
  }
  msg('');
};

// App 傳入頭的方向、飛行設定(速度、高度、是否在 VR)、指令
window.vrLook = function (yaw, pitch) { lookYaw = yaw; lookPitch = pitch; };
window.vrFlightConfig = function (s, a, v) {
  speed = s; altScale = a;
  if (v === undefined || !!v === vr) return;
  vr = !!v;
  if (vr) manual = false;      // VR 裡沒辦法用手勢,回到自動飛行
  else { lookYaw = 0; lookPitch = 0; }
  refreshCtl();
};
window.vrFlight = function (cmd) {
  if (!place) return false;
  if (cmd === 'land') { landed ? takeOff() : land(); return true; }
  if (landed) {   // 在地面上:散步指令
    if (cmd === 'fwd') { walkAuto = false; step(1); }
    else if (cmd === 'back') { walkAuto = false; step(-1); }
    else if (cmd === 'turn') { turnAround(); }
    else if (cmd === 'auto') { walkAuto = !walkAuto; lastStep = performance.now(); flash(walkAuto ? '自動散步:每 ' + walkSec + ' 秒走一步' : '停下來'); }
    else if (cmd === 'faster') { walkSec = Math.max(2, walkSec - 1); flash('每 ' + walkSec + ' 秒走一步'); }
    else if (cmd === 'slower') { walkSec = Math.min(10, walkSec + 1); flash('每 ' + walkSec + ' 秒走一步'); }
    else if (cmd === 'home') { walkAuto = false; if (pano && landPano) fadeTo(function () { pano.setPano(landPano); }); }
    refreshCtl();
    return true;
  }
  if (cmd === 'pause') { if (manual) resume(); else paused = !paused; }
  else if (cmd === 'restart') fadeTo(function () { progress = 0; paused = false; manual = false; });
  else if (cmd === 'next') fadeTo(function () { leg++; progress = 0; paused = false; manual = false; });
  else if (cmd === 'resume') resume();
  refreshCtl();
  return true;
};
// 面板顯示用的狀態
window.vrFlightState = function () {
  return place ? { name: place.name, paused: paused || manual, arrived: progress >= 1, landed: landed, manual: manual,
                   road: landed ? roadName() : '', walking: landed && walkAuto, walkSec: walkSec } : null;
};
// 返回鍵:選地圖 → 回去;地面 → 起飛;手動移動中 → 回到航線;空中 → 目的地選單;已在選單回傳 false(App 回首頁)
window.vrBack = function () {
  if (picking()) { closePick(); return true; }
  if (!place) return false;
  if (landed) { takeOff(); return true; }
  if (manual) { resume(); return true; }
  place = null;
  showMenu();
  return true;
};

window.gm_authFailure = function () {
  closePick(true);
  place = null;
  showMenu();
  msg('金鑰無效,或沒有啟用 Maps JavaScript API<br><button onclick="location.href=\'vrweb://key\'">重新設定金鑰</button>');
};

function showMenu() {
  landed = false;
  manual = false;
  $('sv').style.display = 'none';
  $('map').style.display = 'block';
  renderList();
  $('menu').style.display = 'flex';
  refreshCtl();
}

// 換場景時先變黑再變亮,避免畫面突然跳動造成頭暈
function fadeTo(change) {
  var f = $('fade');
  f.style.opacity = 1;
  setTimeout(function () {
    try { change(); } catch (e) { showErr('發生錯誤:' + (e && e.message ? e.message : e)); }
    refreshCtl();
    f.style.opacity = 0;
  }, 650);
}

// 2D 控制列:只在飛行中、不在 VR、不在選地圖時顯示
function refreshCtl() {
  var on = place && !vr && !menuShown() && !picking();
  $('ctl').style.display = on ? 'flex' : 'none';
  if (!on) return;
  $('cResume').style.display = manual && !landed ? '' : 'none';
  $('cPause').style.display = manual || landed ? 'none' : '';
  $('cPause').textContent = paused ? '繼續' : '暫停';
  $('cNext').style.display = landed ? 'none' : '';
  $('cLand').textContent = landed ? '起飛' : '降落';
  $('cPick').style.display = landed ? 'none' : '';
  $('cFwd').style.display = landed ? '' : 'none';
  $('cAuto').style.display = landed ? '' : 'none';
  $('cAuto').textContent = walkAuto ? '停止' : '自動散步';
  $('cHome').style.display = landed ? '' : 'none';
  $('cTurn').style.display = landed ? '' : 'none';
}

// ---------------- 目的地清單(內建 + 自己存的) ----------------

function myPlaces() {
  try { return JSON.parse(localStorage.getItem('vrPlaces') || '[]'); } catch (e) { return []; }
}
function saveMyPlaces(list) {
  try { localStorage.setItem('vrPlaces', JSON.stringify(list)); } catch (e) {}
}

function renderList() {
  var box = $('list');
  box.innerHTML = '';
  function add(p, mine, index) {
    var row = document.createElement('div');
    row.className = 'place' + (mine ? ' mine' : '');
    var b = document.createElement('button');
    b.textContent = p.name;
    b.onclick = function () { go(p); };
    row.appendChild(b);
    if (mine) {
      var d = document.createElement('button');
      d.className = 'del';
      d.textContent = '✕';
      d.onclick = function () {
        if (d.dataset.sure) {
          var list = myPlaces();
          list.splice(index, 1);
          saveMyPlaces(list);
          renderList();
        } else {
          d.dataset.sure = '1';
          d.textContent = '刪?';
          setTimeout(function () { d.dataset.sure = ''; d.textContent = '✕'; }, 3000);
        }
      };
      row.appendChild(d);
    }
    box.appendChild(row);
  }
  PLACES.forEach(function (p) { add(p, false); });
  myPlaces().forEach(function (p, i) { add(p, true, i); });
}

// ---------------- Google 地圖 ----------------

var loading = null;
function loadMaps() {
  if (loading) return loading;
  loading = new Promise(function (ok, fail) {
    window.__mapsReady = ok;
    var s = document.createElement('script');
    s.src = 'https://maps.googleapis.com/maps/api/js?key=' + encodeURIComponent(key) +
            '&v=beta&libraries=maps3d&language=zh-TW&callback=__mapsReady';
    s.onerror = function () { loading = null; fail(new Error('無法連線到 Google 地圖')); };
    document.head.appendChild(s);
  });
  return loading;
}

var landAfterLoad = false;   // 「散步」:3D 地圖準備好就直接降落到街景
function go(p, walk) {
  if (!key) { window.vrSetKey(''); return; }
  landAfterLoad = !!walk;
  place = p;
  leg = 0; progress = 0; paused = false; landed = false; manual = false;
  msg('載入中…');
  loadMaps().then(function () {
    return google.maps.importLibrary('maps3d');
  }).then(function (lib) {
    if (!map) {
      var opts = { center: { lat: p.lat, lng: p.lng, altitude: p.alt }, range: 1, tilt: 70, heading: 0 };
      try { map = new lib.Map3DElement(Object.assign({ mode: 'SATELLITE', defaultUIHidden: true }, opts)); }
      catch (e) { map = new lib.Map3DElement(opts); }
      $('map').appendChild(map);
    }
    if (place !== p) return;   // 載入中又按了返回
    msg('');
    $('sv').style.display = 'none';
    $('map').style.display = 'block';
    $('menu').style.display = 'none';
    flash(p.name);
    refreshCtl();
    startLoop();
    if (landAfterLoad) { landAfterLoad = false; land(); }
  }).catch(function (e) {
    place = null;
    msg('無法載入 3D 地圖:' + (e && e.message ? e.message : e));
  });
}

// 只跑一個動畫迴圈
function startLoop() {
  last = performance.now();
  if (looping) return;
  looping = true;
  requestAnimationFrame(fly);
}

// 2D 時手指碰到 3D 地圖:停住自動飛行,讓手勢可以拖動、縮放、旋轉
function takeControl() {
  if (!place || vr || landed || manual || menuShown()) return;
  manual = true;
  refreshCtl();
}
$('map').addEventListener('pointerdown', takeControl, true);
$('map').addEventListener('touchstart', takeControl, { capture: true, passive: true });
$('map').addEventListener('wheel', takeControl, { capture: true, passive: true });

function resume() {
  if (!manual) return;
  fadeTo(function () { manual = false; });
}

function ease(x) { return x * x * (3 - 2 * x); }   // 起步、停下都慢慢來

function fly(now) {
  if (!place || menuShown()) { looping = false; return; }
  requestAnimationFrame(fly);
  var dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (landed) {
    // 地面(VR):轉頭控制街景看的方向;2D 時用手指拖動
    if (pano && vr) pano.setPov({ heading: (panoBase + lookYaw + 360) % 360, pitch: Math.max(-80, Math.min(80, lookPitch)) });
    // 自動散步:時間到就沿著路往前走一步(照身體正前方,不是照頭,轉頭看風景不會走歪)
    if (walkAuto && now - lastStep > walkSec * 1000) {
      lastStep = now;
      if (!step(1)) { walkAuto = false; refreshCtl(); }
    }
    gazeStep(dt);
    return;
  }
  if (manual) return;   // 手勢控制中,不要蓋掉
  if (!paused && progress < 1) progress = Math.min(1, progress + dt * speed / GLIDE_SEC);

  var p = place;
  var bearing = (180 + leg * 90) * Math.PI / 180;               // 出發方向(從地標看出去):先從南邊接近
  var dist = p.r * (START_FAR - (START_FAR - 1) * ease(progress));
  var east = Math.sin(bearing) * dist, north = Math.cos(bearing) * dist;
  var alt = p.top + (p.alt - p.top) * altScale;
  var toCenter = (Math.atan2(-east, -north) * 180 / Math.PI + 360) % 360;   // 看向地標的方位(滑行中不變)
  var down = Math.atan2(alt - p.top, dist) * 180 / Math.PI;                 // 看向地標要低頭幾度
  if (vr) {
    // VR:相機放在飛行位置(range 1),轉頭就是原地轉動視線
    map.center = {
      lat: p.lat + north / M_PER_DEG,
      lng: p.lng + east / (M_PER_DEG * Math.cos(p.lat * Math.PI / 180)),
      altitude: alt
    };
    map.range = 1;
    map.heading = (toCenter + lookYaw + 360) % 360;
    map.tilt = Math.max(0, Math.min(90, 90 - down + lookPitch));           // 90 = 看水平
  } else {
    // 2D:同樣的視角,但改成「繞著地標看」,手勢拖動、縮放時以地標為中心
    map.center = { lat: p.lat, lng: p.lng, altitude: p.top };
    map.range = Math.sqrt(dist * dist + (alt - p.top) * (alt - p.top));
    map.heading = toCenter;
    map.tilt = 90 - down;
  }
}

// ---------------- 降落(街景)/ 起飛 ----------------

function headingTo(fromLat, fromLng, toLat, toLng) {
  var dN = (toLat - fromLat) * M_PER_DEG;
  var dE = (toLng - fromLng) * M_PER_DEG * Math.cos(fromLat * Math.PI / 180);
  return (Math.atan2(dE, dN) * 180 / Math.PI + 360) % 360;
}

// 由近到遠找街景;不同版本的 API 有的用回呼、有的回傳 Promise,兩種都接
function findPano(sv, at) {
  var tries = [
    { radius: 300, source: sv.StreetViewSource.OUTDOOR },
    { radius: 2000, source: sv.StreetViewSource.OUTDOOR },
    { radius: 5000, source: sv.StreetViewSource.DEFAULT }
  ];
  var service = new sv.StreetViewService();
  function attempt(i) {
    if (i >= tries.length) return Promise.resolve(null);
    return new Promise(function (ok) {
      var done = false;
      function finish(data) { if (!done) { done = true; ok(data && data.location ? data : null); } }
      try {
        var r = service.getPanorama({ location: at, radius: tries[i].radius, source: tries[i].source,
                                      preference: sv.StreetViewPreference ? sv.StreetViewPreference.NEAREST : undefined },
          function (data, status) { finish(status === 'OK' ? data : null); });
        if (r && r.then) r.then(function (res) { finish(res && res.data); }, function () { finish(null); });
      } catch (e) { finish(null); }
    }).then(function (data) { return data || attempt(i + 1); });
  }
  return attempt(0);
}

function land() {
  var p = place;
  // 2D 手動移動過地圖:降落在畫面中間看著的地方;否則降落在地標附近
  var at = { lat: p.lat, lng: p.lng };
  if (manual && map && map.center) {
    var c = map.center;
    var lat = typeof c.lat === 'function' ? c.lat() : c.lat, lng = typeof c.lng === 'function' ? c.lng() : c.lng;
    if (isFinite(lat) && isFinite(lng)) at = { lat: lat, lng: lng };
  }
  flash('降落中…');
  loadMaps().then(function () {
    return google.maps.importLibrary('streetView');
  }).then(function (sv) {
    return findPano(sv, at).then(function (data) {
      if (place !== p) return;
      if (!data) { flash('這裡附近沒有街景,無法降落'); return; }
      var loc = data.location.latLng;
      // 預設面向地標(或降落點);如果就站在上面,面向原本飛來的方向
      var d = Math.abs(loc.lat() - at.lat) + Math.abs(loc.lng() - at.lng);
      panoBase = d > 0.0002 ? headingTo(loc.lat(), loc.lng(), at.lat, at.lng) : (leg * 90) % 360;
      fadeTo(function () {
        // 先顯示容器再建立街景,不然街景會量到 0 大小、一片空白
        $('sv').style.display = 'block';
        $('map').style.display = 'none';
        if (!pano) {
          pano = new sv.StreetViewPanorama($('sv'), {
            disableDefaultUI: true, showRoadLabels: false,
            clickToGo: true, linksControl: true,   // 2D 時可以點地上的箭頭往前走
            motionTracking: false, motionTrackingControl: false
          });
        }
        pano.setPano(data.location.pano);
        landPano = data.location.pano;
        // 街景的路(links)載入後,正前方沒有路就轉向最近的路
        if (!pano.__faceRoad) {
          pano.__faceRoad = true;
          pano.addListener('links_changed', function () {
            if (pendingFace) { pendingFace = false; faceRoad(); }
          });
        }
        pendingFace = true;
        walkAuto = false;
        pano.setPov({ heading: panoBase, pitch: 0 });
        pano.setVisible(true);
        // 街景載不出來時顯示原因(不然只會一片黑)
        var check = pano;
        setTimeout(function () {
          if (!landed || pano !== check) return;
          var st = check.getStatus ? check.getStatus() : 'OK';
          if (st && st !== 'OK') showErr('街景載入失敗:' + st);
        }, 6000);
        if (google.maps.event) google.maps.event.trigger(pano, 'resize');
        landed = true;
        flash(p.name + '(地面)');
      });
    });
  }).catch(function (e) { showErr('無法載入街景:' + (e && e.message ? e.message : e)); });
}

// ---------------- 散步(街景中前進 / 後退) ----------------

// 目前臉朝的方向(度):VR 用轉頭角度,2D 用街景目前的方向
function viewHeading() {
  if (vr) return (panoBase + lookYaw + 360) % 360;
  var pov = pano && pano.getPov ? pano.getPov() : null;
  return pov ? pov.heading : panoBase;
}

function angleDiff(a, b) { var d = Math.abs(((a - b) % 360 + 360) % 360); return d > 180 ? 360 - d : d; }

// 身體正前方的方向(度):VR = 置中時的正前方(不含轉頭);2D = 目前看的方向
function bodyHeading() { return vr ? panoBase : viewHeading(); }

// 找最接近某個方向的路(在 maxDiff 度以內),沒有回傳 null
function linkToward(heading, maxDiff) {
  var best = null, bestD = 999;
  ((pano && pano.getLinks && pano.getLinks()) || []).forEach(function (l) {
    var d = angleDiff(l.heading, heading);
    if (d < bestD) { bestD = d; best = l; }
  });
  return best && bestD <= maxDiff ? best : null;
}

// 換到下一張街景:短短淡出淡入,並把「正前方」轉成走的方向(坐著的人不用轉身)
var stepping = false;
function goLink(link) {
  if (stepping) return;
  stepping = true;
  var f = $('fade');
  f.style.transition = 'opacity 0.25s';
  f.style.opacity = 1;
  setTimeout(function () {
    try {
      pano.setPano(link.pano);
      if (vr) panoBase = link.heading;
      else pano.setPov({ heading: link.heading, pitch: 0 });
    } catch (e) {}
    f.style.opacity = 0;
    setTimeout(function () { f.style.transition = ''; stepping = false; }, 300);
  }, 260);
}

// dir = 1 往前、-1 往後:沿著街景的路走一步;沒有路回傳 false
function step(dir) {
  if (!pano || !pano.getLinks || stepping) return !stepping ? false : true;
  var want = (bodyHeading() + (dir < 0 ? 180 : 0)) % 360;
  var link = linkToward(want, 100);
  if (!link) { flash(dir < 0 ? '後面沒有路了' : '前面沒有路了,可以按「迴轉」'); return false; }
  goLink(link);
  return true;
}

// 迴轉:整個畫面轉 180 度(坐著不用轉身就能往回走)
function turnAround() {
  if (!pano) return;
  walkAuto = false;
  fadeTo(function () {
    if (vr) panoBase = (panoBase + 180) % 360;
    else { var pov = pano.getPov(); pano.setPov({ heading: (pov.heading + 180) % 360, pitch: 0 }); }
  });
}

// 凝視地面前進:稍微低頭看前方地面(低 15~45 度,還不會叫出面板),那個方向有路就出現箭頭,
// 圓圈填滿(2.5 秒)就往那邊走一步;頭稍微偏左右可以選叉路
var GAZE_SEC = 2.5, gazeT = 0, gazeLink = null;
function gazeStep(dt) {
  var g = $('gaze');
  var link = null;
  if (vr && !stepping && lookPitch < -15 && lookPitch > -45) link = linkToward(viewHeading(), 30);
  if (!link || (gazeLink && link.pano !== gazeLink.pano)) gazeT = 0;
  gazeLink = link;
  if (!link) { g.style.display = 'none'; return; }
  gazeT += dt;
  // 箭頭指向路相對於臉的方向
  var rel = ((link.heading - viewHeading()) % 360 + 540) % 360 - 180;
  $('gazeArrow').style.transform = 'rotate(' + rel + 'deg)';
  g.style.setProperty('--p', Math.min(100, gazeT / GAZE_SEC * 100) + '%');
  g.style.display = 'flex';
  if (gazeT >= GAZE_SEC) { gazeT = 0; walkAuto = false; goLink(link); g.style.display = 'none'; }
}

// 降落後如果正前方沒有路(例如路是左右向),自動轉到最近的一條路,坐著也能直接走
function faceRoad() {
  if (!pano || linkToward(panoBase, 45)) return;
  var link = linkToward(panoBase, 180);
  if (!link) return;
  if (vr) panoBase = link.heading;
  else pano.setPov({ heading: link.heading, pitch: 0 });
}

// 目前所在的路名 / 地名
function roadName() {
  var loc = pano && pano.getLocation ? pano.getLocation() : null;
  return loc ? (loc.description || loc.shortDescription || '') : '';
}

function takeOff() {
  walkAuto = false;
  $('gaze').style.display = 'none';
  fadeTo(function () {
    landed = false;
    $('sv').style.display = 'none';
    $('map').style.display = 'block';
    flash(place ? place.name : '');
  });
}

// ---------------- 在地圖上選地點 ----------------

function openPick() {
  if (!key) { window.vrSetKey(''); return; }
  if (menuShown()) msg('載入地圖中…'); else flash('載入地圖中…');
  loadMaps().then(function () {
    return google.maps.importLibrary('maps');
  }).then(function (lib) {
    msg('');
    $('menu').style.display = 'none';
    $('pick').style.display = 'block';
    $('pickHint').style.display = 'block';
    $('cross').style.display = 'block';
    $('pickBar').style.display = 'flex';
    refreshCtl();
    var start = place ? { lat: place.lat, lng: place.lng } : null;
    if (!pickMap) {
      pickMap = new lib.Map($('pick'), {
        center: start || { lat: 23.7, lng: 121.0 }, zoom: start ? 14 : 7, mapTypeId: 'hybrid',
        streetViewControl: false, fullscreenControl: false, mapTypeControl: false, gestureHandling: 'greedy'
      });
      // 點一下:把那個地方移到中間的十字
      pickMap.addListener('click', function (e) { if (e.latLng) pickMap.panTo(e.latLng); });
      // 地圖圖塊一直沒出來就顯示提示(不然只會一片黑)
      var tiles = false;
      pickMap.addListener('tilesloaded', function () { tiles = true; });
      setTimeout(function () {
        if (!tiles && picking()) showErr('地圖圖塊沒有載入(大小 ' + $('pick').offsetWidth + 'x' + $('pick').offsetHeight + ')');
      }, 10000);
    } else if (start) {
      pickMap.setCenter(start);
      pickMap.setZoom(14);
    }
  }).catch(function (e) {
    closePick(true);
    showErr('無法載入地圖:' + (e && e.message ? e.message : e));
  });
}

// quiet = 只收起選地圖畫面(出錯時用),不另外切畫面
function closePick(quiet) {
  $('pick').style.display = 'none';
  $('pickHint').style.display = 'none';
  $('cross').style.display = 'none';
  $('pickBar').style.display = 'none';
  if (!quiet && !place) showMenu();
  refreshCtl();
}

function pickedLatLng() {
  var c = pickMap && pickMap.getCenter();
  return c ? { lat: c.lat(), lng: c.lng() } : null;
}

// 選到的地點:查地面高度(需要 Elevation API;沒有就當作接近海平面),算出飛行高度
function pickedPlace(name, at) {
  var p = { name: name || '地圖上的地點', lat: at.lat, lng: at.lng, r: 800, alt: 450, top: 50 };
  // 查高度最多等 4 秒,查不到就用預設高度,不讓按鈕看起來沒反應
  var timeout = new Promise(function (ok) { setTimeout(function () { ok(null); }, 4000); });
  var lookup = google.maps.importLibrary('elevation').then(function (lib) {
    return new lib.ElevationService().getElevationForLocations({ locations: [{ lat: p.lat, lng: p.lng }] });
  }).catch(function () { return null; });
  return Promise.race([lookup, timeout]).then(function (res) {
    var g = res && res.results && res.results[0] ? res.results[0].elevation : 0;
    p.top = Math.round(Math.max(0, g) + 50);
    p.alt = Math.round(Math.max(0, g) + 450);
    return p;
  });
}

$('pickBtn').onclick = openPick;
$('pickCancel').onclick = function () { closePick(); };
$('pickGo').onclick = function () {
  var at = pickedLatLng();
  if (!at) return;
  flash('起飛中…');
  pickedPlace($('pname').value.trim(), at).then(function (p) {
    closePick(true);
    go(p);
  });
};
$('pickWalk').onclick = function () {
  var at = pickedLatLng();
  if (!at) return;
  flash('前往街景…');
  pickedPlace($('pname').value.trim(), at).then(function (p) {
    closePick(true);
    go(p, true);
  });
};
$('pickSave').onclick = function () {
  var at = pickedLatLng();
  if (!at) return;
  var name = $('pname').value.trim() || ('我的地點 ' + (myPlaces().length + 1));
  pickedPlace(name, at).then(function (p) {
    var list = myPlaces();
    list.push(p);
    saveMyPlaces(list);
    $('pname').value = '';
    flash('已存成「' + name + '」');
  });
};

// 2D 控制列
$('cResume').onclick = function () { resume(); };
$('cPause').onclick = function () { window.vrFlight('pause'); };
$('cNext').onclick = function () { window.vrFlight('next'); };
$('cLand').onclick = function () { window.vrFlight('land'); };
$('cFwd').onclick = function () { window.vrFlight('fwd'); };
$('cAuto').onclick = function () { window.vrFlight('auto'); };
$('cHome').onclick = function () { window.vrFlight('home'); };
$('cTurn').onclick = function () { window.vrFlight('turn'); };
$('cPick').onclick = openPick;
$('cMenu').onclick = function () { if (landed) landed = false; place = null; showMenu(); };

renderList();
</script>
