<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa3e0"/><stop offset=".6" stop-color="#a9d2f2"/><stop offset="1" stop-color="#e8f3fb"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/><stop offset=".35" stop-color="#e9b93c"/><stop offset=".7" stop-color="#b5801c"/><stop offset="1" stop-color="#7a4f0e"/>
    </linearGradient>
    <linearGradient id="goldv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe98a"/><stop offset=".5" stop-color="#d9a52e"/><stop offset="1" stop-color="#8a5a10"/>
    </linearGradient>
    <radialGradient id="face" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#ffe9a0"/><stop offset=".55" stop-color="#e2b043"/><stop offset="1" stop-color="#9b6714"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#a8761a"/><stop offset=".5" stop-color="#e7bb45"/><stop offset="1" stop-color="#fff2b0"/>
    </linearGradient>
    <clipPath id="c"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <g opacity=".75" fill="#fff">
