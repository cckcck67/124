<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>聊天</title>
<style>
:root {
  --green: #06c755; --bubble-me: #9de68f; --room-bg: #8cabd8;
  --gray: #8e8e93; --line: #ececec; --text: #111;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; background: #fff; color: var(--text);
  font-family: -apple-system, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
button { font: inherit; }
input, textarea { -webkit-user-select: text; user-select: text; }
.screen { position: fixed; inset: 0; display: flex; flex-direction: column; background: #fff; }
.hidden { display: none !important; }
svg { display: block; }

/* ---------- 聊天列表 ---------- */
.top { display: flex; align-items: center; padding: 10px 14px 6px 14px; gap: 10px; }
.pill { background: #111; color: #fff; border-radius: 22px; padding: 8px 16px; font-size: 19px; font-weight: 700;
  display: flex; align-items: center; gap: 4px; user-select: none; }
.tab2 { font-size: 19px; font-weight: 700; padding: 0 8px; }
.top .sp { flex: 1; }
.ico { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; position: relative; }
.ico .dot { position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; background: var(--green); border-radius: 50%; }
.search { margin: 6px 14px 4px; background: #f2f2f4; border-radius: 22px; display: flex; align-items: center; padding: 0 12px; height: 38px; gap: 8px; }
.search input { flex: 1; border: 0; background: transparent; font-size: 16px; outline: none; color: #111; }
.search input::placeholder { color: #aaa; }
.list { flex: 1; overflow-y: auto; }
.row { display: flex; align-items: center; padding: 9px 14px; gap: 12px; user-select: none; }
.row:active { background: #f5f5f5; }
.av { width: 52px; height: 52px; border-radius: 50%; flex: none; position: relative; background: #ccc center/cover no-repeat;
  display: flex; align-items: center; justify-content: center; color: #fff; font-size: 21px; font-weight: 600; }
.av .pin { position: absolute; right: -2px; bottom: -2px; width: 20px; height: 20px; border-radius: 50%; background: #4b7bf5;
  border: 2px solid #fff; display: flex; align-items: center; justify-content: center; }
.row .mid { flex: 1; min-width: 0; }
.row .name { font-size: 17px; display: flex; align-items: center; gap: 4px; white-space: nowrap; overflow: hidden; }
.row .name span.n { overflow: hidden; text-overflow: ellipsis; }
.row .prev { font-size: 14px; color: var(--gray); margin-top: 3px; line-height: 1.3;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
.row .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; align-self: flex-start; padding-top: 4px; }
.row .time { font-size: 12px; color: var(--gray); white-space: nowrap; }
.row .unread { background: var(--green); color: #fff; font-size: 11px; border-radius: 10px; padding: 1px 6px; min-width: 18px; text-align: center; }
.nav { display: flex; border-top: 1px solid var(--line); padding: 6px 0 4px; background: #fff; }
.nav div { flex: 1; display: flex; flex-direction: column; align-items: center; font-size: 11px; gap: 2px; position: relative; color: #111; }
.nav .rd { position: absolute; top: -1px; left: calc(50% + 8px); width: 7px; height: 7px; border-radius: 50%; background: #ff334b; }
.nav .badge { position: absolute; top: -6px; left: calc(50% + 4px); background: #ff334b; color: #fff; font-size: 11px; font-weight: 700;
  border-radius: 10px; padding: 0 5px; border: 2px solid #fff; line-height: 15px; }
.empty { text-align: center; color: #999; padding: 40px 20px; font-size: 14px; line-height: 1.8; }

/* ---------- 聊天室 ---------- */
#room { background: var(--room-bg) center/cover no-repeat; }
.rhead { display: flex; align-items: center; padding: 8px 8px 6px 4px; gap: 4px; }
.rhead .title { flex: 1; font-size: 20px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 4px; user-select: none; }
.announce { margin: 2px 4px 4px; background: #fff; border-radius: 6px; display: flex; align-items: center; padding: 10px 12px; gap: 10px;
  font-size: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.announce .t { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msgs { flex: 1; overflow-y: auto; padding: 6px 10px 10px; }
.chip { text-align: center; margin: 12px 0; }
.chip span { display: inline-block; background: rgba(60, 80, 120, .35); color: #fff; font-size: 12px; border-radius: 12px; padding: 4px 12px; }
.m { display: flex; align-items: flex-end; margin-top: 10px; gap: 6px; }
.m.cont { margin-top: 4px; }
.m.l .avs { width: 34px; height: 34px; align-self: flex-start; flex: none; font-size: 14px; }
.m.l .avs.blank { visibility: hidden; }
.m.r { justify-content: flex-end; }
.m .col { display: flex; flex-direction: column; max-width: 72%; min-width: 0; }
.m .who { font-size: 11px; color: #33405a; margin: 0 0 3px 4px; }
.m .line { display: flex; align-items: flex-end; gap: 5px; }
.m.r .line { flex-direction: row-reverse; }
.m .meta { font-size: 10px; color: #3a4a66; line-height: 1.25; white-space: nowrap; flex: none; padding-bottom: 1px; }
.m.r .meta { text-align: right; }
.bub { position: relative; background: #fff; border-radius: 18px; padding: 8px 13px; font-size: 16px; line-height: 1.4;
  white-space: pre-wrap; word-break: break-word; min-width: 0; }
.m.r .bub { background: var(--bubble-me); }
.m.l.tail .bub::before, .m.r.tail .bub::before { content: ''; position: absolute; top: 0; width: 12px; height: 12px; background: inherit; }
.m.l.tail .bub::before { left: -5px; clip-path: polygon(0 0, 100% 0, 100% 100%); }
.m.r.tail .bub::before { right: -5px; clip-path: polygon(0 0, 100% 0, 0 100%); }
.stk { width: 130px; height: 130px; object-fit: contain; display: block; }
.stk.emo { font-size: 92px; line-height: 130px; text-align: center; }
.pic { max-width: 200px; max-height: 260px; border-radius: 14px; display: block; }
.pic.ph { width: 160px; height: 120px; background: #dfe5ee; display: flex; align-items: center; justify-content: center; font-size: 34px; }
.call { display: flex; align-items: center; gap: 8px; }
.call .ci { width: 30px; height: 30px; border-radius: 50%; background: #e9eef5; display: flex; align-items: center; justify-content: center; }
.m.r .call .ci { background: rgba(255,255,255,.55); }
.ibar { display: flex; align-items: center; gap: 2px; padding: 6px 6px; background: #fff; }
.ibar .box { flex: 1; min-width: 0; display: flex; align-items: center; background: #f2f2f4; border-radius: 20px; padding: 0 6px 0 14px; min-height: 38px; }
.ibar textarea { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 16px; resize: none; outline: none; max-height: 96px;
  padding: 8px 0; line-height: 1.35; font-family: inherit; }
.asbar { background: #fff8d6; font-size: 12px; padding: 4px 12px; display: flex; justify-content: space-between; align-items: center; }

/* ---------- 編輯面板 ---------- */
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; z-index: 10; }
.sheet { background: #fff; width: 100%; max-height: 88%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 14px 16px 18px; }
.sheet h3 { margin: 0 0 10px; font-size: 17px; }
.fld { margin: 10px 0; }
.fld label.lb { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
.fld input[type=text], .fld textarea, .fld select { width: 100%; font-size: 16px; padding: 9px 10px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; background: #fff; }
.fld textarea { min-height: 80px; }
.fld.ck label { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.fld.ck input { width: 20px; height: 20px; }
.imgf { display: flex; align-items: center; gap: 10px; }
.imgf .pv { width: 56px; height: 56px; border-radius: 8px; background: #eee center/contain no-repeat; flex: none; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.btn { flex: 1 1 auto; border: 0; background: #eef0f3; color: #111; border-radius: 10px; padding: 11px 12px; font-size: 15px; }
.btn.pri { background: var(--green); color: #fff; font-weight: 600; }
.btn.dan { background: #ffe5e7; color: #d0021b; }
.btn.sm { flex: 0 0 auto; padding: 8px 12px; font-size: 14px; }
.menu .btn { display: block; width: 100%; text-align: left; margin: 6px 0; }
.hint { font-size: 12px; color: #888; line-height: 1.6; margin-top: 8px; }
.toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(0,0,0,.78); color: #fff; padding: 8px 16px;
  border-radius: 18px; font-size: 14px; z-index: 20; pointer-events: none; }
</style>
</head>
<body>

<!-- 聊天列表 -->
<div id="home" class="screen">
  <div class="top">
    <div class="pill" id="pillChat">聊天 <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 4l4 4 4-4z" fill="#fff"/></svg></div>
    <div class="tab2">好友</div>
    <div class="sp"></div>
    <div class="ico"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#111" stroke-width="2"><path d="M3 6h7l2 2h11v13H3z"/><path d="M9 18l4-5 3 3 2-2 3 4" stroke-linejoin="round"/></svg></div>
    <div class="ico"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="4" y="5" width="18" height="17" rx="3" fill="none" stroke="#111" stroke-width="2"/><path d="M9 3v4M17 3v4" stroke="#111" stroke-width="2"/><text x="13" y="19" font-size="9" font-weight="700" text-anchor="middle" fill="#111">31</text></svg></div>

    <div><svg width="26" height="26" viewBox="0 0 26 26"><path d="M13 3C7 3 2.5 7 2.5 12c0 3 1.6 5.5 4 7l-.8 4 4.4-2.4c.9.2 1.9.3 2.9.3 6 0 10.5-4 10.5-9S19 3 13 3z" fill="#111"/><circle cx="8.5" cy="12" r="1.4" fill="#fff"/><circle cx="13" cy="12" r="1.4" fill="#fff"/><circle cx="17.5" cy="12" r="1.4" fill="#fff"/></svg>聊天<span class="badge" id="navBadge"></span></div>
    <div><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#111" stroke-width="2"><rect x="4" y="9" width="18" height="13" rx="2"/><path d="M9 9V7a4 4 0 0 1 8 0v2"/></svg>逛逛<span class="rd"></span></div>
    <div><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#111" stroke-width="2"><path d="M6 3l4 1 1.5 5-2.5 2a13 13 0 0 0 6 6l2-2.5 5 1.5 1 4c-1 1.5-3 2-5 1.5C10.5 19.5 6.5 15.5 4.5 9 4 7 4.5 4.5 6 3z" stroke-linejoin="round"/></svg>通話</div>
    <div><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#111" stroke-width="2"><rect x="3" y="6" width="20" height="15" rx="3"/><path d="M3 10h20M16 15h3"/></svg>錢包<span class="rd"></span></div>
  </div>
</div>

<!-- 聊天室 -->
<div id="room" class="screen hidden">
  <div class="rhead">
    <div class="ico" id="btnBack"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#111" stroke-width="2.4"><path d="M16 4L7 13l9 9"/></svg></div>
    <div class="title" id="roomTitle"></div>

    <div class="ico"><svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#111" stroke-width="2"><path d="M6 3l4 1 1.5 5-2.5 2a13 13 0 0 0 6 6l2-2.5 5 1.5 1 4c-1 1.5-3 2-5 1.5C10.5 19.5 6.5 15.5 4.5 9 4 7 4.5 4.5 6 3z" stroke-linejoin="round"/></svg></div>
    <div class="ico"><svg width="26" height="26" viewBox="0 0 26 26"><rect x="4" y="5" width="18" height="17" rx="3" fill="none" stroke="#111" stroke-width="2"/><path d="M9 3v4M17 3v4" stroke="#111" stroke-width="2"/><text x="13" y="19" font-size="9" font-weight="700" text-anchor="middle" fill="#111">31</text></svg></div>

    </div>

</div>

<input type="file" id="filePick" class="hidden">

<script>
'use strict';
// ================= 資料 =================
const SAVE_KEY = 'prankchat';
const WEEK = '日一二三四五六';
const COLORS = ['#f4a261', '#2a9d8f', '#e76f51', '#6d83c4', '#c77dba', '#5aa469', '#d4a017', '#8d6e63'];
const MIC = '<svg width="26" height="26" viewBox="0 0 26 26" fill="none" stroke="#111" stroke-width="2"><rect x="9" y="3" width="8" height="13" rx="4"/><path d="M5 12a8 8 0 0 0 16 0M13 20v4"/></svg>';
const SEND = '<svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="13" fill="#06c755"/><path d="M8 14l12-6-4 13-3-5z" fill="#fff"/></svg>';
const PIN = '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M3 1h4l-1 3 2 2H5.5L5 9.5 4.5 6H2l2-2z" fill="#fff"/></svg>';
const MUTE = '<svg width="16" height="16" viewBox="0 0 16 16" fill="#999"><path d="M2 6v4h3l4 3V3L5 6z"/><path d="M11 3l4 10" stroke="#999" stroke-width="1.5"/></svg>';

let uid = Date.now();
const nid = () => 'i' + (uid++).toString(36);
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const nowTime = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };

function dateChip(d) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  const x = new Date(d); x.setHours(0, 0, 0, 0);
  const diff = Math.round((t - x) / 86400000);
  if (diff === 0) return '今天';
  if (diff === 1) return '昨天';
  const s = (x.getMonth() + 1) + '月' + x.getDate() + '日 週' + WEEK[x.getDay()];
  return x.getFullYear() === t.getFullYear() ? s : x.getFullYear() + '年' + s;
}

function msg(who, text, time, extra) { return Object.assign({ id: nid(), t: 'msg', who, kind: 'text', text, time, read: who === 'me' ? '已讀' : '' }, extra || {}); }
function chat(name, o) {
  const c = Object.assign({ id: nid(), name, avatar: '', count: '', pinned: false, muted: false, preview: '', time: '', unread: '',
    announce: '', bg: '', group: false, members: [{ id: 'f', name, avatar: '' }], items: [] }, o || {});
  return c;
}

// 第一次打開時的內容(照目前手機上的聊天列表),之後可以全部改掉
function sample() {
  const today = dateChip(new Date());
  const bf = chat('蝴蝶🦋啾啾', { announce: '台新銀行812...', items: [
    msg('me', '', '21:08', { kind: 'sticker', text: '👌' }),
    msg('f', '廚房我們今天吃什麼', '22:50'),
    msg('me', '炒麵', '22:50'),
    msg('f', '喔喔', '23:04'),
    { id: nid(), t: 'date', text: '9月29日 週二' },
    msg('f', '廚房我們晚上吃什麼', '18:48'),
    msg('me', '用心之作\n誠意滿滿\n精心烹製\n講究工法\n用心調味\n技法純熟\n功夫紮實\n火候精準\n手路細緻..\n的飯菜', '18:50'),
    msg('f', '', '19:00', { kind: 'sticker', text: '😋' })
  ] });
  bf.items.unshift({ id: nid(), t: 'date', text: '9月28日 週一' });
  return {
    me: { name: '我', avatar: '' },
    navBadge: '197',
    locked: false,
    chats: [
      chat('阿里巴巴養生會館', { count: '98', pinned: true, group: true, members: [{ id: 'f', name: '❤️Dongfang東方❤️', avatar: '' }],
        items: [{ id: nid(), t: 'date', text: today }, msg('f', '', '20:38', { kind: 'sticker', text: '🌸' })] }),
      chat('阿里巴巴訂貨群', { count: '7', pinned: true, muted: true, group: true, members: [{ id: 'f', name: '小陳', avatar: '' }],
        items: [{ id: nid(), t: 'date', text: today }, msg('f', '明天買看看', '18:08')] }),
      chat('小高', { items: [{ id: nid(), t: 'date', text: today }, msg('f', '通話時間 3:59', '21:05', { kind: 'call' })] }),
      chat('理財金融-Eddie-王副理', { preview: '理財金融-Eddie-王副理向您傳送了聯絡資訊',
        items: [{ id: nid(), t: 'date', text: today }, msg('f', '這是我的聯絡資訊，有問題隨時找我', '20:58')] }),
      chat('高雄推薦當鋪-高發當鋪', { items: [{ id: nid(), t: 'date', text: today }, msg('f', '感謝', '20:24')] }),
      chat('🐈愛貓魚 Lyra🐈‍⬛', { items: [{ id: nid(), t: 'date', text: today }, msg('f', '我今天沒打卡， 要代自己的班，謝謝 照片是說我沒有遲到', '19:02')] }),
      bf
    ]
  };
}

let S;
function load() {
  let raw = '';
  try { raw = window.Android ? Android.load() : localStorage.getItem(SAVE_KEY); } catch (e) {}
  try { S = raw ? JSON.parse(raw) : null; } catch (e) { S = null; }
  if (!S || !Array.isArray(S.chats)) S = sample();
}
let saveTimer = 0;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const s = JSON.stringify(S);
    try { if (window.Android) Android.save(s); else localStorage.setItem(SAVE_KEY, s); } catch (e) { toast('儲存失敗:' + e.message); }
  }, 300);
}
function setBars(color) { try { if (window.Android) Android.setBars(color); } catch (e) {} }

// ================= 共用 =================
function toast(t) {
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); setTimeout(() => d.remove(), 1800);
}
function colorOf(s) { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.codePointAt(0)) >>> 0; return COLORS[h % COLORS.length]; }
function firstChar(s) { const m = String(s || '?').match(/[\p{L}\p{N}]/u); return m ? m[0] : '?'; }
function avatarHtml(name, src, cls, extra) {
  const style = src ? `background-image:url('${src}')` : `background-color:${colorOf(name)}`;
  return `<div class="av ${cls || ''}" style="${style}">${src ? '' : esc(firstChar(name))}${extra || ''}</div>`;
}
function onLong(el, fn, shortFn) {
  let timer = 0, fired = false, sx = 0, sy = 0;
  el.addEventListener('touchstart', e => { fired = false; sx = e.touches[0].clientX; sy = e.touches[0].clientY; timer = setTimeout(() => { fired = true; fn(e); }, 550); }, { passive: true });
  el.addEventListener('touchmove', e => { if (Math.abs(e.touches[0].clientX - sx) + Math.abs(e.touches[0].clientY - sy) > 10) clearTimeout(timer); }, { passive: true });
  el.addEventListener('touchend', e => { clearTimeout(timer); if (fired) e.preventDefault(); });
  el.addEventListener('contextmenu', e => { e.preventDefault(); clearTimeout(timer); if (!fired) { fired = true; fn(e); } });
  if (shortFn) el.addEventListener('click', e => { if (!fired) shortFn(e); });
}

// 選圖片並縮小(存在手機裡的資料不會太大)
function pickImage(maxSize, png) {
  return new Promise(resolve => {
    const f = $('filePick'); f.accept = 'image/*'; f.value = '';
    f.onchange = () => {
      const file = f.files[0]; if (!file) return resolve('');
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const k = Math.min(1, maxSize / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(png ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.85));
        };
        img.onerror = () => resolve('');
        img.src = r.result;
      };
      r.readAsDataURL(file);
    };
    f.click();
  });
}
function pickText() {
  return new Promise(resolve => {
    const f = $('filePick'); f.accept = '.txt,text/plain'; f.value = '';
    f.onchange = () => {
      const file = f.files[0]; if (!file) return resolve('');
      const r = new FileReader(); r.onload = () => resolve(r.result); r.readAsText(file, 'utf-8');
    };
    f.click();
  });
}

// ---------- 底部編輯面板 ----------
// fields: [{k, label, type: text|area|select|check|image, opts, size, png}]
// buttons: [{label, cls, fn(values) -> 回傳 false 不關閉}]
let sheetStack = [];
function sheet(title, fields, buttons, hint) {
  const mask = document.createElement('div'); mask.className = 'mask';
  const sh = document.createElement('div'); sh.className = 'sheet'; mask.appendChild(sh);
  let h = `<h3>${esc(title)}</h3>`;
  const vals = {};
  (fields || []).forEach((f, i) => {
    vals[f.k] = f.v;
    if (f.type === 'check') h += `<div class="fld ck"><label><input type="checkbox" data-i="${i}" ${f.v ? 'checked' : ''}>${esc(f.label)}</label></div>`;
    else if (f.type === 'image') h += `<div class="fld"><label class="lb">${esc(f.label)}</label><div class="imgf"><div class="pv" data-pv="${i}" style="${f.v ? `background-image:url('${f.v}')` : ''}"></div><button class="btn sm" data-pick="${i}">選擇圖片</button><button class="btn sm" data-clear="${i}">移除</button></div></div>`;
    else if (f.type === 'select') h += `<div class="fld"><label class="lb">${esc(f.label)}</label><select data-i="${i}">${f.opts.map(o => `<option value="${esc(o[0])}" ${o[0] === f.v ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></div>`;
    else if (f.type === 'area') h += `<div class="fld"><label class="lb">${esc(f.label)}</label><textarea data-i="${i}">${esc(f.v)}</textarea></div>`;
    else h += `<div class="fld"><label class="lb">${esc(f.label)}</label><input type="text" data-i="${i}" value="${esc(f.v)}" placeholder="${esc(f.ph || '')}"></div>`;
  });
  h += `<div class="btns ${fields && fields.length ? '' : 'menu'}">${buttons.map((b, i) => `<button class="btn ${b.cls || ''}" data-b="${i}">${esc(b.label)}</button>`).join('')}</div>`;
  if (hint) h += `<div class="hint">${hint}</div>`;
  sh.innerHTML = h;
  const close = () => { mask.remove(); sheetStack = sheetStack.filter(x => x !== close); };
  sheetStack.push(close);
  mask.addEventListener('click', e => { if (e.target === mask) close(); });
  sh.querySelectorAll('[data-pick]').forEach(b => b.onclick = async () => {
    const f = fields[b.dataset.pick]; const src = await pickImage(f.size || 600, f.png);
    if (src) { vals[f.k] = src; sh.querySelector(`[data-pv="${b.dataset.pick}"]`).style.backgroundImage = `url('${src}')`; }
  });
  sh.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => {
    vals[fields[b.dataset.clear].k] = ''; sh.querySelector(`[data-pv="${b.dataset.clear}"]`).style.backgroundImage = '';
  });
  sh.querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    sh.querySelectorAll('[data-i]').forEach(el => { const f = fields[el.dataset.i]; vals[f.k] = f.type === 'check' ? el.checked : el.value; });
    if (buttons[b.dataset.b].fn(vals) !== false) close();
  });
  document.body.appendChild(mask);
  return close;
}

// ================= 聊天列表 =================
function previewOf(c) {
  if (c.preview) return c.preview;
  const m = [...c.items].reverse().find(x => x.t === 'msg');
  if (!m) return '';
  const who = m.who === 'me' ? '您' : (memberOf(c, m.who).name || c.name);
  if (m.kind === 'sticker') return who + ' 傳送了貼圖';
  if (m.kind === 'image') return who + ' 傳送了照片';
  if (m.kind === 'call') return m.text;
  return m.text;
}
function timeOf(c) {
  if (c.time) return c.time;
  const m = [...c.items].reverse().find(x => x.t === 'msg');
  return m ? m.time : '';
}
function renderList() {
  $('navBadge').textContent = S.navBadge || '';
  $('navBadge').classList.toggle('hidden', !S.navBadge);
  const q = $('q').value.trim().toLowerCase();
  const order = [...S.chats.filter(c => c.pinned), ...S.chats.filter(c => !c.pinned)];
  const shown = order.filter(c => !q || c.name.toLowerCase().includes(q));
  $('list').innerHTML = shown.map(c => `
    <div class="row" data-id="${c.id}">
      ${avatarHtml(c.name, c.avatar, '', c.pinned ? `<span class="pin">${PIN}</span>` : '')}
      <div class="mid">
        <div class="name"><span class="n">${esc(c.name)}</span>${c.count ? `<span>(${esc(c.count)})</span>` : ''}${c.muted ? MUTE : ''}</div>
        <div class="prev">${esc(previewOf(c))}</div>
      </div>
      <div class="rt"><div class="time">${esc(timeOf(c))}</div>${c.unread ? `<div class="unread">${esc(c.unread)}</div>` : ''}</div>
    </div>`).join('') || `<div class="empty">還沒有聊天<br>按右上角「＋」新增,或從 LINE 匯入聊天記錄</div>`;
  $('list').querySelectorAll('.row').forEach(r => onLong(r, () => editChat(r.dataset.id), () => openRoom(r.dataset.id)));
}

function editChat(id, after) {
  const c = S.chats.find(x => x.id === id); if (!c) return;
  const f = c.members[0] || { id: 'f', name: c.name, avatar: '' };
  sheet('編輯聊天:' + c.name, [
    { k: 'name', label: '名稱', v: c.name },
    { k: 'avatar', label: '大頭貼', type: 'image', v: c.avatar, size: 240 },
    { k: 'count', label: '人數(群組名稱後面的數字,空白不顯示)', v: c.count },
    { k: 'preview', label: '列表上顯示的最後訊息(空白 = 自動用最後一則)', v: c.preview },
    { k: 'time', label: '列表上的時間(空白 = 自動,也可以寫「昨天」「9/28」)', v: c.time },
    { k: 'unread', label: '未讀數量(綠色圓圈,空白不顯示)', v: c.unread },
    { k: 'announce', label: '聊天室上方公告(空白不顯示)', v: c.announce },
    { k: 'pinned', label: '釘選在最上面', type: 'check', v: c.pinned },
    { k: 'muted', label: '關閉提醒(顯示靜音圖示)', type: 'check', v: c.muted },
    { k: 'group', label: '群組(對方訊息上方顯示名字)', type: 'check', v: c.group }
  ], [
    { label: '儲存', cls: 'pri', fn: v => {
      const oldName = c.name;
      Object.assign(c, { name: v.name.trim() || c.name, avatar: v.avatar, count: v.count.trim(), preview: v.preview, time: v.time.trim(),
        unread: v.unread.trim(), announce: v.announce, pinned: v.pinned, muted: v.muted, group: v.group });
      if (!c.group && c.members.length === 1 && f.name === oldName) f.name = c.name;
      save(); renderList(); if (after) after();
    } },
    { label: '成員 / 對方', fn: () => { editMembers(c, after); } },
    { label: '上移', cls: 'sm', fn: () => { move(S.chats, c, -1); save(); renderList(); return false; } },
    { label: '下移', cls: 'sm', fn: () => { move(S.chats, c, 1); save(); renderList(); return false; } },
    { label: '刪除聊天', cls: 'dan', fn: () => { if (!confirm('刪除「' + c.name + '」?')) return false; S.chats = S.chats.filter(x => x !== c); save(); closeRoom(); renderList(); } }
  ], '長按列表上的聊天可以打開這裡。');
}

function editMembers(c, after) {
  const btns = c.members.map(m => ({ label: '✎ ' + m.name, fn: () => editMember(c, m, after) }));
  btns.push({ label: '＋ 新增成員(群組用)', fn: () => {
    const m = { id: nid(), name: '新成員', avatar: '' }; c.members.push(m); c.group = true; save(); editMember(c, m, after);
  } });
  sheet('成員 / 對方', null, btns, '一對一聊天只有一位「對方」;群組可以有很多位,傳訊息時選要用誰的身分。');
}
function editMember(c, m, after) {
  sheet('編輯成員', [
    { k: 'name', label: '名字', v: m.name },
    { k: 'avatar', label: '大頭貼(空白 = 用聊天的大頭貼)', type: 'image', v: m.avatar, size: 240 }
  ], [
    { label: '儲存', cls: 'pri', fn: v => { m.name = v.name.trim() || m.name; m.avatar = v.avatar; save(); renderList(); if (after) after(); } },
    { label: '刪除這位成員', cls: 'dan', fn: () => {
      if (c.members.length <= 1) { toast('至少要留一位'); return false; }
      if (c.items.some(x => x.who === m.id) && !confirm('這位成員的訊息會改成第一位成員的,確定?')) return false;
      c.members = c.members.filter(x => x !== m);
      c.items.forEach(x => { if (x.who === m.id) x.who = c.members[0].id; });
      save(); if (after) after();
    } }
  ]);
}
function move(arr, x, d) { const i = arr.indexOf(x), j = i + d; if (j < 0 || j >= arr.length) return; arr[i] = arr[j]; arr[j] = x; }

function addMenu() {
  sheet('新增', null, [
    { label: '＋ 新增一對一聊天', fn: () => newChat(false) },
    { label: '＋ 新增群組', fn: () => newChat(true) },
    { label: '⇩ 匯入 LINE 聊天記錄(.txt)', fn: async () => { const t = await pickText(); if (t) importLineText(t); } },
    { label: '⚙ 設定', fn: settings }
  ], 'LINE 匯入方法:在 LINE 打開那個聊天 → 右上角 ≡ → 其他設定 → 傳送聊天記錄 → 選這個 App(或先存成檔案,再用上面的「匯入」選檔案)。對話內容就會整個帶進來,不用從頭打。');
}
function newChat(group) {
  sheet(group ? '新增群組' : '新增聊天', [{ k: 'name', label: group ? '群組名稱' : '對方名字', v: '' }], [
    { label: '建立', cls: 'pri', fn: v => {
      const name = v.name.trim(); if (!name) { toast('請輸入名字'); return false; }
      const c = chat(name, { group, members: [{ id: 'f', name: group ? '朋友' : name, avatar: '' }],
        items: [{ id: nid(), t: 'date', text: '今天' }] });
      S.chats.splice(S.chats.filter(x => x.pinned).length, 0, c);
      save(); renderList(); openRoom(c.id);
    } }
  ]);
}
function settings() {
  sheet('設定', [
    { k: 'name', label: '我的名字(匯入 LINE 記錄時用來認出自己)', v: S.me.name },
    { k: 'badge', label: '下方「聊天」紅色數字(空白不顯示)', v: S.navBadge }
  ], [
    { label: '儲存', cls: 'pri', fn: v => { S.me.name = v.name.trim() || '我'; S.navBadge = v.badge.trim(); save(); renderList(); } },
    { label: '恢復範例內容', cls: 'dan', fn: () => { if (!confirm('全部聊天會被換回範例,確定?')) return false; S = sample(); save(); renderList(); } }
  ], '小技巧:聊天室裡長按上方名字可以「鎖定」,鎖定後點訊息不會跳出編輯,給朋友看比較不會穿幫;再長按一次解除。');
}

// ================= 聊天室 =================
let cur = null;      // 目前聊天
let asWho = 'me';    // 送出訊息用的身分
function memberOf(c, who) { return c.members.find(m => m.id === who) || c.members[0] || { name: c.name, avatar: '' }; }

function openRoom(id) {
  cur = S.chats.find(x => x.id === id); if (!cur) return;
  asWho = 'me';
  if (cur.unread) { cur.unread = ''; save(); renderList(); }
  $('home').classList.add('hidden'); $('room').classList.remove('hidden');
  renderRoom(true);
}
function closeRoom() {
  cur = null; $('room').classList.add('hidden'); $('home').classList.remove('hidden');
  $('inp').value = ''; updSend(); setBars('#ffffff'); renderList();
}
function renderRoom(toBottom) {
  if (!cur) return;
  const c = cur;
  $('roomTitle').textContent = c.name + (c.count ? ' (' + c.count + ')' : '');
  $('announce').classList.toggle('hidden', !c.announce);
  $('announceText').textContent = c.announce;
  $('room').style.backgroundImage = c.bg ? `url('${c.bg}')` : '';
  setBars(c.bg ? '#000000' : '#8cabd8');
  const box = $('msgs'); const keep = box.scrollTop;
  let h = '', prev = null;
  for (const it of c.items) {
    if (it.t === 'date') { h += `<div class="chip" data-id="${it.id}"><span>${esc(it.text)}</span></div>`; prev = null; continue; }
    const me = it.who === 'me';
    const first = !prev || prev.who !== it.who;
    const mem = me ? null : memberOf(c, it.who);
    let body;
    if (it.kind === 'sticker') body = it.src ? `<img class="stk" src="${it.src}">` : `<div class="stk emo">${esc(it.text || '😆')}</div>`;
    else if (it.kind === 'image') body = it.src ? `<img class="pic" src="${it.src}">` : `<div class="pic ph">🖼️</div>`;
    else if (it.kind === 'call') body = `<div class="bub"><div class="call"><span class="ci"><svg width="16" height="16" viewBox="0 0 26 26" fill="none" stroke="#333" stroke-width="2.4"><path d="M6 3l4 1 1.5 5-2.5 2a13 13 0 0 0 6 6l2-2.5 5 1.5 1 4c-1 1.5-3 2-5 1.5C10.5 19.5 6.5 15.5 4.5 9 4 7 4.5 4.5 6 3z"/></svg></span>${esc(it.text)}</div></div>`;
    else body = `<div class="bub">${esc(it.text)}</div>`;
    const meta = `<div class="meta">${me && it.read ? esc(it.read) + '<br>' : ''}${esc(it.time)}</div>`;
    const tail = first && (it.kind === 'text' || it.kind === 'call') ? ' tail' : '';
    if (me) h += `<div class="m r${tail}${first ? '' : ' cont'}" data-id="${it.id}"><div class="col"><div class="line">${body}${meta}</div></div></div>`;
    else h += `<div class="m l${tail}${first ? '' : ' cont'}" data-id="${it.id}">${avatarHtml(mem.name, mem.avatar || (c.group ? '' : c.avatar), 'avs' + (first ? '' : ' blank'))}<div class="col">${c.group && first ? `<div class="who">${esc(mem.name)}</div>` : ''}<div class="line">${body}${meta}</div></div></div>`;
    prev = it;
  }
  box.innerHTML = h || '<div class="empty" style="color:#fff">還沒有訊息,在下面輸入文字送出</div>';
  box.querySelectorAll('[data-id]').forEach(el => el.addEventListener('click', () => { if (!S.locked) editItem(el.dataset.id); }));
  if (toBottom) box.scrollTop = box.scrollHeight; else box.scrollTop = keep;
  updAs();
}

function whoOpts(c) { return [['me', '我(右邊綠色)'], ...c.members.map(m => [m.id, m.name + '(左邊白色)'])]; }

function editItem(id) {
  const c = cur, it = c.items.find(x => x.id === id); if (!it) return;
  const idx = () => c.items.indexOf(it);
  const done = () => { save(); renderRoom(false); renderList(); };
  const common = [
    { label: '上移', cls: 'sm', fn: () => { move(c.items, it, -1); done(); return false; } },
    { label: '下移', cls: 'sm', fn: () => { move(c.items, it, 1); done(); return false; } },
    { label: '在下面插入訊息', fn: () => { const m = msg(it.who || 'me', '', it.time || nowTime()); c.items.splice(idx() + 1, 0, m); done(); editItem(m.id); } },
    { label: '在下面插入日期', fn: () => { const d = { id: nid(), t: 'date', text: '今天' }; c.items.splice(idx() + 1, 0, d); done(); editItem(d.id); } },
    { label: '刪除', cls: 'dan', fn: () => { c.items.splice(idx(), 1); done(); } }
  ];
  if (it.t === 'date') {
    sheet('編輯日期 / 置中文字', [{ k: 'text', label: '文字(例如「今天」「昨天」「9月29日 週二」「小明已收回訊息」)', v: it.text }],
      [{ label: '儲存', cls: 'pri', fn: v => { it.text = v.text; done(); } }, ...common]);
    return;
  }
  sheet('編輯訊息', [
    { k: 'who', label: '誰說的', type: 'select', opts: whoOpts(c), v: it.who },
    { k: 'kind', label: '種類', type: 'select', opts: [['text', '文字'], ['sticker', '貼圖'], ['image', '照片'], ['call', '通話紀錄']], v: it.kind },
    { k: 'text', label: '內容(貼圖沒有選圖片時,這裡放一個表情符號會顯示成大貼圖)', type: 'area', v: it.text },
    { k: 'src', label: '圖片(貼圖 / 照片用)', type: 'image', v: it.src || '', size: 900 },
    { k: 'time', label: '時間', v: it.time },
    { k: 'read', label: '已讀文字(只有自己的訊息會顯示;群組可寫「已讀 3」,空白 = 未讀)', v: it.read }
  ], [
    { label: '儲存', cls: 'pri', fn: v => { Object.assign(it, { who: v.who, kind: v.kind, text: v.text, src: v.src, time: v.time.trim(), read: v.read.trim() }); done(); } },
    ...common
  ]);
}

function send(asOther) {
  const t = $('inp').value; if (!t.trim() || !cur) return;
  let who = asWho;
  if (asOther) who = who === 'me' ? cur.members[0].id : 'me';
  cur.items.push(msg(who, t.replace(/\s+$/, ''), nowTime()));
  cur.time = ''; cur.preview = '';
  // 跟 LINE 一樣,有新訊息的聊天移到(釘選以外的)最上面
  if (!cur.pinned) { S.chats = S.chats.filter(x => x !== cur); S.chats.splice(S.chats.filter(x => x.pinned).length, 0, cur); }
  $('inp').value = ''; autosize(); updSend();
  save(); renderRoom(true);
}
function addMedia(kind) {
  if (!cur) return;
  pickImage(kind === 'sticker' ? 320 : 1000, kind === 'sticker').then(src => {
    if (!src) return;
    cur.items.push(msg(asWho, '', nowTime(), { kind, src }));
    cur.time = ''; cur.preview = '';
    save(); renderRoom(true);
  });
}
function updAs() {
  const on = cur && asWho !== 'me';
  $('asbar').classList.toggle('hidden', !on);
  if (on) $('asText').textContent = '目前用「' + memberOf(cur, asWho).name + '」的身分傳訊息';
}
function tools() {
  if (!cur) return;
  const c = cur;
  const btns = [];
  if (asWho !== 'me') btns.push({ label: '↺ 改回用自己的身分傳訊息', fn: () => { asWho = 'me'; updAs(); } });
  c.members.forEach(m => { if (asWho !== m.id) btns.push({ label: '⇄ 用「' + m.name + '」的身分傳訊息', fn: () => { asWho = m.id; updAs(); } }); });
  btns.push(
    { label: '😆 傳貼圖(從手機選圖片)', fn: () => addMedia('sticker') },
    { label: '📅 加一個日期分隔', fn: () => { const d = { id: nid(), t: 'date', text: '今天' }; c.items.push(d); save(); renderRoom(true); editItem(d.id); } },
    { label: '✎ 編輯聊天(名稱、公告、大頭貼…)', fn: () => editChat(c.id, () => renderRoom(false)) },
    { label: '👥 成員 / 對方', fn: () => editMembers(c, () => renderRoom(false)) },
    { label: '🖼 聊天背景圖片', fn: async () => { const s = await pickImage(1400); if (s) { c.bg = s; save(); renderRoom(false); } } },
    { label: c.bg ? '🖼 移除背景圖片(恢復藍色)' : '', fn: () => { c.bg = ''; save(); renderRoom(false); } },
    { label: '⇩ 匯入 LINE 聊天記錄到這裡', fn: async () => { const t = await pickText(); if (t) importLineText(t, c); } },
    { label: '🗑 清空這個聊天的所有訊息', cls: 'dan', fn: () => { if (!confirm('清空所有訊息?')) return false; c.items = []; save(); renderRoom(true); renderList(); } }
  );
  sheet('編輯工具', null, btns.filter(b => b.label), '點任何一則訊息可以修改內容、時間、誰說的;點日期也能改。長按送出鍵 = 用對方的身分送出。');
}

function autosize() { const t = $('inp'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 96) + 'px'; }
function updSend() { $('btnSend').innerHTML = $('inp').value.trim() ? SEND : MIC; }

// ================= 匯入 LINE 聊天記錄 =================
// 支援 LINE「傳送聊天記錄」的文字檔(新舊格式、24 / 12 小時制、多行訊息)
function to24(s) {
  const m = s.trim().match(/^(上午|下午|AM|PM)?\s*(\d{1,2}):(\d{2})\s*(AM|PM)?$/i); if (!m) return null;
  let h = +m[2]; const ap = (m[1] || m[4] || '').toUpperCase();
  if ((ap === '下午' || ap === 'PM') && h < 12) h += 12;
  if ((ap === '上午' || ap === 'AM') && h === 12) h = 0;
  return pad(h) + ':' + m[3];
}
function parseLine(txt) {
  const lines = txt.replace(/^﻿/, '').replace(/\r\n?/g, '\n').split('\n');
  let title = '', items = [], names = [], last = null, quote = false;
  const reDate = /^(\d{4})[\/.\-](\d{1,2})[\/.\-](\d{1,2})(?:\s*[（(]?[^\t]{0,8}?[)）]?)?\s*$/;
  // 引號包住的多行訊息裡,遇到新的日期或訊息就當作引號結束(避免單獨一個 " 吃掉後面全部)
  const isLineStart = ln => reDate.test(ln) || (ln.includes('\t') && !!to24(ln.split('\t')[0]));
  for (let i = 0; i < lines.length; i++) {
    const ln = lines[i];
    if (quote && last && !isLineStart(ln)) { last.text += '\n' + ln; if (/"\s*$/.test(ln)) { quote = false; last.text = last.text.replace(/^"/, '').replace(/"\s*$/, ''); } continue; }
    if (i < 4 && !items.length) {
      const m = ln.match(/^\[LINE\]\s*與(.+?)的聊天記錄/) || ln.match(/^\[LINE\]\s*(.+?)的聊天記錄/) || ln.match(/^\[LINE\]\s*Chat history (?:with|in) (.+)$/i);
      if (m) { title = m[1].trim(); continue; }
      if (/^(儲存日期|Saved on|保存日期)/i.test(ln)) continue;
    }
    quote = false;
    if (!ln.trim()) { if (last) last.blank = (last.blank || 0) + 1; continue; }
    const dm = ln.match(reDate);
    if (dm) { items.push({ id: nid(), t: 'date', text: dateChip(new Date(+dm[1], +dm[2] - 1, +dm[3])) }); last = null; continue; }
    let time = null, name = null, text = null;
    const p = ln.split('\t');
    if (p.length >= 2 && (time = to24(p[0]))) {
      if (p.length >= 3) { name = p[1].trim(); text = p.slice(2).join('\t'); } else text = p[1];
    } else {
      const m = ln.match(/^((?:上午|下午)?\d{1,2}:\d{2}(?:\s?[AP]M)?)\s+(\S+)\s+(.+)$/i);
      if (m && (time = to24(m[1]))) { name = m[2]; text = m[3]; }
    }
    if (time) {
      if (!name) { items.push({ id: nid(), t: 'date', text: text.trim() }); last = null; continue; }   // 系統訊息(收回、加入群組…)
      if (!names.includes(name)) names.push(name);
      last = { id: nid(), t: 'msg', name, time, text, kind: 'text', read: '' };
      items.push(last);
      if (/^"/.test(text) && !/^".*"\s*$/.test(text)) quote = true;
      else if (/^".*"$/.test(text) && text.length > 1) last.text = text.slice(1, -1);
      continue;
    }
    if (last) last.text += '\n'.repeat((last.blank || 0) + 1) + ln;   // 沒有時間的行 = 上一則訊息的下一行
    if (last) last.blank = 0;
  }
  items.forEach(it => {
    if (it.t !== 'msg') return;
    delete it.blank;
    const t = it.text.trim();
    if (/^\[(貼圖|Sticker|スタンプ)\]$/i.test(t)) { it.kind = 'sticker'; it.text = '😆'; }
    else if (/^\[(照片|圖片|Photo|写真)\]$/i.test(t)) { it.kind = 'image'; it.text = ''; }
    else if (/^☎/.test(t)) { it.kind = 'call'; it.text = t.replace(/^☎\s*/, ''); }
  });
  return { title, items, names };
}

function importLineText(txt, target) {
  const r = parseLine(String(txt || ''));
  const msgs = r.items.filter(x => x.t === 'msg');
  if (!msgs.length) { toast('看不懂這個檔案,請用 LINE 的「傳送聊天記錄」產生的 .txt'); return; }
  let others = r.names;
  const finish = myName => {
    const group = r.names.filter(n => n !== myName).length > 1;
    const title = (target && target.name) || r.title || r.names.find(n => n !== myName) || '匯入的聊天';
    const items = r.items.slice(-600);   // 太多訊息手機會變慢,留最後 600 則
    let c = target || S.chats.find(x => x.name === title);
    if (c && !target && !confirm('已經有「' + title + '」,要用匯入的內容取代它的訊息嗎?(按取消會另外建立一個)')) c = null;
    if (!c) { c = chat(title, { group }); c.members = []; S.chats.splice(S.chats.filter(x => x.pinned).length, 0, c); }
    c.group = c.group || group;
    const byName = {};
    c.members.forEach(m => byName[m.name] = m.id);
    items.forEach(it => {
      if (it.t !== 'msg') return;
      if (it.name === myName) { it.who = 'me'; it.read = '已讀'; }
      else {
        if (!byName[it.name]) { const m = { id: c.members.length || target ? nid() : 'f', name: it.name, avatar: '' }; c.members.push(m); byName[it.name] = m.id; }
        it.who = byName[it.name];
      }
      delete it.name;
    });
    if (!c.members.length) c.members.push({ id: 'f', name: title, avatar: '' });
    c.items = items; c.preview = ''; c.time = '';
    S.me.name = myName;
    save(); renderList(); openRoom(c.id);
    toast('已匯入 ' + items.filter(x => x.t === 'msg').length + ' 則訊息');
  };
  if (r.names.includes(S.me.name)) return finish(S.me.name);
  if (r.names.length === 2 && r.title && r.names.includes(r.title)) return finish(r.names.find(n => n !== r.title));
  if (r.names.length === 1 && r.title && r.names[0] === r.title) return finish('__nobody__');
  sheet('哪一個是你?', null, [...others.map(n => ({ label: n, fn: () => finish(n) })), { label: '都不是(全部放左邊)', fn: () => finish('__nobody__') }],
    '你的訊息會放在右邊(綠色),其他人放左邊。');
}

window.appBack = function () {
  if (sheetStack.length) { sheetStack[sheetStack.length - 1](); return true; }
  if (cur) { closeRoom(); return true; }
  return false;
};
